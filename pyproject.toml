[project]
name = "abswm"
version = "0.1.0"
description = "Reproducible quarter-car ABS and physics-enhanced world-model experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "matplotlib>=3.9,<4",
  "torch==2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
abswm = "abswm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
